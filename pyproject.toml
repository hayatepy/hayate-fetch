[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[project]
name = "hayate-fetch"
version = "0.2.0"
description = "Client-side WHATWG fetch for hayate: the same Request/Response types, pointed outward"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yusuke Hayashi" }]
keywords = ["hayate", "fetch", "http-client", "workers"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["hayate>=0.8.0"]

[project.optional-dependencies]
httpx = ["httpx>=0.28,<1"]

[project.urls]
Homepage = "https://hayatepy.dev/ecosystem/#hayate-fetch"
Repository = "https://github.com/hayatepy/hayate-fetch"
Documentation = "https://github.com/hayatepy/hayate-fetch#readme"
Changelog = "https://github.com/hayatepy/hayate-fetch/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.18",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
